<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500">
  <rect width="820" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" font-weight="bold" fill="#1a1a2e">Circuit Schematic: One Motor via L293D H-Bridge</text>
  <text x="410" y="48" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="10" fill="#666">IC shown as a labeled block. Pin numbers and names on both sides. Motor 2 uses pins 9–15 (not shown).</text>

  <!-- ======================== -->
  <!--   RASPBERRY PI BLOCK     -->
  <!-- ======================== -->
  <rect x="20" y="85" width="130" height="310" rx="5"
        fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="112" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="13" font-weight="bold" fill="#2c3e50">Raspberry</text>
  <text x="85" y="129" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="13" font-weight="bold" fill="#2c3e50">Pi</text>
  <text x="85" y="147" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="9" fill="#7f8c8d">(BCM pin numbers)</text>

  <!-- GPIO 17 → EN1 -->
  <text x="143" y="183" text-anchor="end" font-family="'Courier New', monospace"
        font-size="10" fill="#1b5e20">GPIO 17</text>
  <text x="143" y="194" text-anchor="end" font-family="'Courier New', monospace"
        font-size="8" fill="#1b5e20">(EN1 / PWM)</text>
  <line x1="150" y1="188" x2="220" y2="188" stroke="#1b5e20" stroke-width="2"/>

  <!-- GPIO 23 → IN1 -->
  <text x="143" y="242" text-anchor="end" font-family="'Courier New', monospace"
        font-size="10" fill="#1565c0">GPIO 23</text>
  <text x="143" y="253" text-anchor="end" font-family="'Courier New', monospace"
        font-size="8" fill="#1565c0">(IN1)</text>
  <line x1="150" y1="247" x2="220" y2="247" stroke="#1565c0" stroke-width="2"/>

  <!-- GPIO 24 → IN2 -->
  <text x="143" y="296" text-anchor="end" font-family="'Courier New', monospace"
        font-size="10" fill="#4a148c">GPIO 24</text>
  <text x="143" y="307" text-anchor="end" font-family="'Courier New', monospace"
        font-size="8" fill="#4a148c">(IN2)</text>
  <line x1="150" y1="301" x2="220" y2="301" stroke="#4a148c" stroke-width="2"/>

  <!-- 5V → Vm and Vss (shared) -->
  <text x="143" y="350" text-anchor="end" font-family="'Courier New', monospace"
        font-size="11" fill="#c62828">5V</text>
  <line x1="150" y1="346" x2="220" y2="346" stroke="#c62828" stroke-width="2"/>

  <!-- GND -->
  <text x="143" y="380" text-anchor="end" font-family="'Courier New', monospace"
        font-size="11" fill="#333">GND</text>
  <line x1="150" y1="376" x2="220" y2="376" stroke="#333" stroke-width="2"/>

  <!-- ======================== -->
  <!--   L293D IC BLOCK         -->
  <!-- ======================== -->
  <rect x="270" y="120" width="180" height="270" rx="4"
        fill="#fafafa" stroke="#37474f" stroke-width="2.5"/>
  <!-- IC Label -->
  <text x="360" y="160" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="16" font-weight="bold" fill="#37474f">L293D</text>
  <text x="360" y="178" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="9" fill="#78909c">dual H-bridge</text>
  <!-- Notch at top (standard IC notation) -->
  <path d="M 340,120 A 20,20 0 0,0 380,120" fill="white" stroke="#37474f" stroke-width="2.5"/>

  <!-- Left side pin stubs (inputs from Pi) -->
  <!-- EN1 (pin 1) at y=188 -->
  <line x1="220" y1="188" x2="270" y2="188" stroke="#1b5e20" stroke-width="2"/>
  <text x="274" y="185" font-family="'Courier New', monospace" font-size="9" fill="#1b5e20">EN1</text>
  <text x="274" y="195" font-family="'Courier New', monospace" font-size="8" fill="#78909c">pin 1</text>

  <!-- IN1 (pin 2) at y=247 -->
  <line x1="220" y1="247" x2="270" y2="247" stroke="#1565c0" stroke-width="2"/>
  <text x="274" y="244" font-family="'Courier New', monospace" font-size="9" fill="#1565c0">IN1</text>
  <text x="274" y="254" font-family="'Courier New', monospace" font-size="8" fill="#78909c">pin 2</text>

  <!-- IN2 (pin 7) at y=301 -->
  <line x1="220" y1="301" x2="270" y2="301" stroke="#4a148c" stroke-width="2"/>
  <text x="274" y="298" font-family="'Courier New', monospace" font-size="9" fill="#4a148c">IN2</text>
  <text x="274" y="308" font-family="'Courier New', monospace" font-size="8" fill="#78909c">pin 7</text>

  <!-- Vm (pin 8) at y=346 — motor power -->
  <line x1="220" y1="346" x2="270" y2="346" stroke="#c62828" stroke-width="2"/>
  <text x="274" y="343" font-family="'Courier New', monospace" font-size="9" fill="#c62828">Vm</text>
  <text x="274" y="353" font-family="'Courier New', monospace" font-size="8" fill="#78909c">pin 8</text>

  <!-- 5V junction: splits to Vm and Vss -->
  <!-- Vss label inside IC, connected via internal junction shown conceptually -->
  <!-- Show Vss on right side top as it connects internally -->

  <!-- GND (pins 4,5) at y=376 -->
  <line x1="220" y1="376" x2="270" y2="376" stroke="#333" stroke-width="2"/>
  <text x="274" y="373" font-family="'Courier New', monospace" font-size="9" fill="#333">GND</text>
  <text x="274" y="383" font-family="'Courier New', monospace" font-size="8" fill="#78909c">pins 4,5</text>

  <!-- Right side pin stubs (outputs to motor) -->
  <!-- Vss (pin 16) at y=155 — logic power, shown on right -->
  <line x1="450" y1="155" x2="500" y2="155" stroke="#c62828" stroke-width="2"/>
  <text x="422" y="152" font-family="'Courier New', monospace" font-size="9"
        text-anchor="end" fill="#c62828">Vss</text>
  <text x="422" y="162" font-family="'Courier New', monospace" font-size="8"
        text-anchor="end" fill="#78909c">pin 16</text>
  <!-- Vss label destination -->
  <text x="505" y="152" font-family="'Courier New', monospace" font-size="9" fill="#c62828">5V</text>
  <text x="505" y="163" font-family="'Courier New', monospace" font-size="8" fill="#78909c">(logic)</text>

  <!-- OUT1 (pin 3) at y=247 -->
  <line x1="450" y1="247" x2="520" y2="247" stroke="#e65100" stroke-width="2"/>
  <text x="422" y="244" font-family="'Courier New', monospace" font-size="9"
        text-anchor="end" fill="#e65100">OUT1</text>
  <text x="422" y="254" font-family="'Courier New', monospace" font-size="8"
        text-anchor="end" fill="#78909c">pin 3</text>

  <!-- OUT2 (pin 6) at y=301 -->
  <line x1="450" y1="301" x2="520" y2="301" stroke="#e65100" stroke-width="2"/>
  <text x="422" y="298" font-family="'Courier New', monospace" font-size="9"
        text-anchor="end" fill="#e65100">OUT2</text>
  <text x="422" y="308" font-family="'Courier New', monospace" font-size="8"
        text-anchor="end" fill="#78909c">pin 6</text>

  <!-- 5V wire from Pi: splits to Vm (at y=346 left side) and Vss (y=155 right side) -->
  <!-- Junction point at x=220, y=346 where the 5V wire arrives from Pi -->
  <!-- Wire goes up from (220,346) to (220,155) then right to (500,155) for Vss -->
  <circle cx="220" cy="346" r="3.5" fill="#c62828"/>
  <line x1="220" y1="155" x2="220" y2="346" stroke="#c62828" stroke-width="2"/>
  <line x1="220" y1="155" x2="500" y2="155" stroke="#c62828" stroke-width="2"/>

  <!-- ======================== -->
  <!--   MOTOR SYMBOL           -->
  <!-- ======================== -->

  <!-- Motor circle -->
  <circle cx="630" cy="274" r="58" fill="#fff8e1" stroke="#e65100" stroke-width="2.5"/>
  <text x="630" y="269" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="24" font-weight="bold" fill="#e65100">M</text>
  <text x="630" y="288" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="10" fill="#e65100">TT motor</text>

  <!-- OUT1 wire → Motor terminal A -->
  <line x1="520" y1="247" x2="572" y2="247" stroke="#e65100" stroke-width="2"/>
  <text x="524" y="238" font-family="'Courier New', monospace" font-size="9" fill="#e65100">A+</text>

  <!-- OUT2 wire → Motor terminal B -->
  <line x1="520" y1="301" x2="572" y2="301" stroke="#e65100" stroke-width="2"/>
  <text x="524" y="315" font-family="'Courier New', monospace" font-size="9" fill="#e65100">A−</text>

  <!-- ======================== -->
  <!--   GND BUS                -->
  <!-- ======================== -->

  <!-- GND drop from Pi at y=376 to bus at y=430 -->
  <line x1="220" y1="376" x2="220" y2="430" stroke="#333" stroke-width="2"/>

  <!-- GND bus (horizontal) -->
  <line x1="190" y1="430" x2="500" y2="430" stroke="#333" stroke-width="2"/>
  <circle cx="220" cy="430" r="3.5" fill="#333"/>

  <!-- GND symbol -->
  <line x1="340" y1="430" x2="340" y2="444" stroke="#333" stroke-width="2"/>
  <line x1="324" y1="444" x2="356" y2="444" stroke="#333" stroke-width="2.5"/>
  <line x1="330" y1="452" x2="350" y2="452" stroke="#333" stroke-width="2"/>
  <line x1="336" y1="460" x2="344" y2="460" stroke="#333" stroke-width="1.5"/>
  <text x="362" y="458" font-family="'Courier New', monospace" font-size="10"
        fill="#333" font-weight="bold">GND (common)</text>

  <!-- Note about Vss needing separate wire from same 5V source -->
  <text x="410" y="468" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="9" fill="#888">Note: Vm (motor power) and Vss (logic) both connect to Pi 5V — use separate wires, not a shared jumper.</text>
</svg>
